<!DOCTYPE html>
<html lang="es-BO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gema Pastelería | Pedidos</title>

<!-- Google Fonts: Poppins (títulos) y Nunito (texto general) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ======================================================
     VARIABLES DE DISEÑO (paleta pastel clara, estilo kiosco)
     ====================================================== */
  :root{
    --color-fondo: #FFF9F3;        /* crema claro de fondo */
    --color-acento: #FFC59E;       /* naranja pastel principal */
    --color-acento-fuerte: #E8793A;/* naranja fuerte: bordes seleccionados, CTA */
    --color-acento-oscuro: #B85A24;/* para texto sobre fondos claros */
    --color-durazno: #FFE6D3;      /* durazno pastel: fondo de selección */
    --color-borde-suave: #E9DFD3;  /* borde gris claro de opciones no elegidas */
    --color-marca: #5C3A21;        /* marrón chocolate del logo: títulos y texto importante */
    --color-texto: #2E2A26;        /* texto principal, buen contraste */
    --color-texto-suave: #8A7A6C;  /* subtítulos / texto secundario */
    --color-blanco: #FFFFFF;
    --color-exito: #D8F1DF;
    --color-exito-texto: #276B43;
    --color-error-texto: #B23B2E;
    --sombra-suave: 0 6px 18px rgba(46,42,38,0.08);
    --sombra-hover: 0 14px 28px rgba(46,42,38,0.14);
    --sombra-boton: 0 10px 22px rgba(232,121,58,0.35);
    --radio-grande: 22px;
    --radio-mediano: 16px;
    --radio-chico: 10px;
    --ancho-contenido: 1100px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--color-fondo);
    font-family: 'Nunito', sans-serif;
    color: var(--color-texto);
    -webkit-tap-highlight-color: transparent;
  }

  h1,h2,h3,h4, .fuente-titulo{
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    color: var(--color-marca);
  }

  button{ font-family: inherit; cursor: pointer; border: none; outline: none; background:none; color:inherit; }
  input, textarea, select{ font-family: inherit; }
  [data-lucide]{ width:1em; height:1em; }

  /* ---------- Encabezado de marca (fijo arriba, ancho completo) ---------- */
  .topbar{
    background: linear-gradient(135deg, var(--color-acento) 0%, var(--color-durazno) 100%);
    padding: 16px 20px;
  }
  .topbar-inner{
    max-width: var(--ancho-contenido);
    margin: 0 auto;
    display:flex;
    align-items:center;
    gap: 14px;
  }
  .logo-wrap{
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--color-blanco);
    display:flex; align-items:center; justify-content:center;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: var(--sombra-suave);
  }
  .logo-wrap i{ width:26px; height:26px; color: var(--color-acento-fuerte); stroke-width: 1.8; }
  .logo-wrap img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:6px; }
  .marca-texto h1{ margin:0; font-size:1.3rem; color: var(--color-marca); letter-spacing:.2px; }
  .marca-texto p{ margin:2px 0 0; font-size:.82rem; font-weight:700; color: var(--color-marca); opacity:.75; }

  /* ---------- Contenido principal, centrado y ancho en pantallas grandes ---------- */
  #app-content{
    max-width: var(--ancho-contenido);
    margin: 0 auto;
    padding: 20px 20px 120px;
    animation: fadeIn .35s ease;
  }

  @keyframes fadeIn{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* ---------- Fila "volver" ---------- */
  .fila-volver{
    display:flex; align-items:center; gap:12px;
    margin-bottom: 18px;
  }
  .btn-volver{
    background: var(--color-blanco);
    color: var(--color-texto);
    width: 44px; height: 44px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--sombra-suave);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-volver i{ width:20px; height:20px; }
  .btn-volver:hover{ box-shadow: var(--sombra-hover); transform: translateY(-1px); }
  .btn-volver:active{ transform: scale(0.9); }
  .titulo-pantalla{
    font-size: 1.3rem;
    margin: 0;
  }

  /* ---------- HERO de inicio ---------- */
  .hero{
    position: relative;
    border-radius: var(--radio-grande);
    overflow: hidden;
    min-height: 220px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 20px;
    background: linear-gradient(135deg, var(--color-acento) 0%, var(--color-durazno) 100%);
    box-shadow: var(--sombra-suave);
    margin-bottom: 26px;
  }
  .hero-contenido{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    text-align: center;
    background: rgba(255,249,243,0.92);
    border-radius: var(--radio-grande);
    padding: 26px 28px;
    box-shadow: 0 10px 26px rgba(92,58,33,0.16);
  }
  .hero-logo{
    display:block;
    width: 100%;
    max-width: 220px;
    height: auto;
    object-fit: contain;
    margin: 0 auto 14px;
  }
  @media (min-width: 700px){
    .hero-logo{ max-width: 260px; }
  }
  .hero-contenido h2{ margin:0 0 6px; font-size: 1.5rem; }
  .hero-contenido p{ margin:0; font-weight:700; font-size:.95rem; color: var(--color-marca); opacity:.85; }

  .intro-categorias{ text-align:center; margin: 4px 0 20px; }
  .intro-categorias h3{ margin:0 0 4px; font-size:1.15rem; }
  .intro-categorias p{ margin:0; color: var(--color-texto-suave); font-weight:700; font-size:.88rem; }

  /* ---------- Fotos con respaldo automático (icono si no hay imagen) ---------- */
  .foto-respaldo{
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, var(--color-acento), var(--color-durazno));
    display:flex; align-items:center; justify-content:center;
  }
  .foto-respaldo i{
    width: 34%; height: 34%;
    max-width: 48px; max-height: 48px;
    color: #a65a28;
    opacity: .85;
    stroke-width: 1.5;
  }
  .foto-respaldo img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
  }

  /* ---------- Tarjetas de categoría (inicio) ---------- */
  .grid-categorias{
    display:flex; flex-wrap:wrap;
    gap: 20px;
    justify-content: center;
  }
  .tarjeta-categoria{
    flex: 1 1 230px;
    max-width: 260px;
    background: var(--color-blanco);
    border-radius: var(--radio-grande);
    box-shadow: var(--sombra-suave);
    overflow: hidden;
    text-align:left;
    display:flex; flex-direction:column;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  @media (hover:hover){
    .tarjeta-categoria:hover{ transform: translateY(-5px); box-shadow: var(--sombra-hover); }
  }
  .tarjeta-categoria:active{ transform: scale(0.97); }
  .tarjeta-categoria .foto-respaldo{ height: 150px; width:100%; }
  .info-categoria{ padding: 14px 16px 18px; display:flex; flex-direction:column; gap:3px; }
  .nombre-categoria{ font-weight:800; font-size:1rem; font-family:'Poppins',sans-serif; }
  .desde-categoria{ font-size:.82rem; color: var(--color-acento-oscuro); font-weight:700; }

  @media (max-width: 639px){
    .tarjeta-categoria{ flex: 1 1 100%; max-width: 100%; }
  }

  /* ---------- Barra de progreso (armador de tortas) ---------- */
  .progreso-pasos{
    display:flex; align-items:flex-start;
    margin-bottom: 22px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .paso{ display:flex; flex-direction:column; align-items:center; gap:6px; min-width: 64px; }
  .paso-circulo{
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--color-blanco);
    border: 2px solid var(--color-borde-suave);
    color: var(--color-texto-suave);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:.82rem;
    transition: all .2s ease;
  }
  .paso-circulo i{ width:14px; height:14px; }
  .paso-nombre{ font-size:.72rem; font-weight:700; color: var(--color-texto-suave); white-space:nowrap; }
  .paso.hecho .paso-circulo{ background: var(--color-acento-fuerte); border-color: var(--color-acento-fuerte); color:#fff; }
  .paso.hecho .paso-nombre{ color: var(--color-acento-oscuro); }
  .paso.actual .paso-circulo{ border-color: var(--color-acento-fuerte); box-shadow: 0 0 0 4px rgba(232,121,58,0.18); }
  .paso.actual .paso-nombre{ color: var(--color-texto); }
  .paso-linea{
    flex: 1;
    height: 2px;
    background: var(--color-borde-suave);
    margin: 14px 4px 0;
    min-width: 20px;
  }

  /* ---------- Secciones genéricas ---------- */
  .seccion{
    background: var(--color-blanco);
    border-radius: var(--radio-grande);
    box-shadow: var(--sombra-suave);
    padding: 20px;
    margin-bottom: 18px;
  }
  .seccion h3{
    margin: 0 0 14px;
    font-size: 1rem;
    display:flex; align-items:center; gap:10px;
  }
  .seccion h3 i{ width:18px; height:18px; color: var(--color-acento-fuerte); }
  .paso-num{
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--color-durazno);
    color: var(--color-acento-oscuro);
    font-size:.78rem; font-weight:800;
    display:inline-flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }

  /* ---------- Opción seleccionable genérica (chip / tarjeta) ---------- */
  .opcion-seleccionable{
    position: relative;
    background: var(--color-blanco);
    border: 2px solid var(--color-borde-suave);
    border-radius: var(--radio-mediano);
    transition: border-color .15s ease, background .15s ease, transform .12s ease, box-shadow .15s ease;
  }
  @media (hover:hover){
    .opcion-seleccionable:hover{ border-color: var(--color-acento); transform: translateY(-2px); }
  }
  .opcion-seleccionable:active{ transform: scale(0.96); }
  .opcion-seleccionable.seleccionado{
    background: var(--color-durazno);
    border-color: var(--color-acento-fuerte);
    box-shadow: var(--sombra-boton);
  }
  .check-badge{
    position: absolute;
    top: -8px; right: -8px;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--color-acento-fuerte);
    color: #fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 3px 8px rgba(232,121,58,0.5);
    animation: popIn .22s ease;
    z-index: 2;
  }
  .check-badge i{ width:14px; height:14px; stroke-width:3; }
  @keyframes popIn{
    from{ transform: scale(0); opacity:0; }
    to{ transform: scale(1); opacity:1; }
  }

  /* ---------- Chips de tamaño ---------- */
  .grid-chips{
    display:flex; flex-wrap:wrap;
    gap: 10px;
  }
  .chip{
    flex: 1 1 100px;
    max-width: 130px;
    padding: 12px 8px;
    text-align:center;
    font-weight: 700;
    font-size: .85rem;
    color: var(--color-texto);
    display:flex; flex-direction:column; gap:4px; align-items:center;
  }
  .chip-tam{ font-weight:800; }
  .chip-precio{ font-size:.76rem; color: var(--color-acento-oscuro); font-weight:700; }

  /* ---------- Tarjetas de tipo de torta (con foto) ---------- */
  .grid-tipos{
    display:flex; flex-wrap:wrap;
    gap: 14px;
  }
  .tarjeta-tipo{
    flex: 1 1 250px;
    max-width: 320px;
    display:flex; flex-direction:column;
    text-align:left;
    overflow: hidden;
  }
  .tarjeta-tipo .foto-respaldo{ height: 110px; border-radius: 13px 13px 0 0; }
  .info-tipo{ padding: 12px 14px 14px; display:flex; flex-direction:column; gap:3px; }
  .nombre-tipo{ font-weight:800; font-family:'Poppins',sans-serif; font-size:.95rem; }
  .desc-tipo{ font-size:.78rem; color: var(--color-texto-suave); font-weight:600; }
  .precio-tipo{ font-size:.82rem; color: var(--color-acento-oscuro); font-weight:800; margin-top:2px; }
  @media (max-width: 639px){ .tarjeta-tipo{ flex: 1 1 100%; max-width:100%; } }

  /* ---------- Tarjetas de sabor (con foto pequeña) ---------- */
  .grid-sabores{
    display:flex; flex-wrap:wrap;
    gap: 10px;
  }
  .tarjeta-sabor{
    flex: 1 1 110px;
    max-width: 140px;
    display:flex; flex-direction:column; align-items:center;
    padding-bottom: 10px;
    overflow: hidden;
  }
  .tarjeta-sabor .foto-respaldo{ height: 70px; width:100%; border-radius: 13px 13px 0 0; }
  .tarjeta-sabor .foto-respaldo i{ max-width:28px; max-height:28px; }
  .nombre-sabor{ font-size:.78rem; font-weight:700; margin-top:8px; padding: 0 6px; text-align:center; }
  @media (max-width: 420px){ .tarjeta-sabor{ flex: 1 1 42%; } }

  /* ---------- Caja de precio base ---------- */
  .caja-precio{
    background: var(--color-durazno);
    border-radius: var(--radio-mediano);
    padding: 14px 18px;
    display:flex; justify-content:space-between; align-items:center;
    margin: 2px 0 18px;
  }
  .caja-precio span{ font-weight: 700; font-size: .88rem; color: var(--color-acento-oscuro); }
  .caja-precio strong{ font-size: 1.3rem; font-family:'Poppins', sans-serif; }

  /* ---------- Extras (switch) ---------- */
  .fila-extra{
    display:flex; align-items:center; justify-content:space-between;
    gap: 12px;
    padding: 13px 14px;
    background: var(--color-fondo);
    border-radius: var(--radio-mediano);
    margin-bottom: 10px;
    border: 2px solid transparent;
    transition: all .15s ease;
  }
  @media (hover:hover){ .fila-extra:hover{ border-color: var(--color-acento); } }
  .fila-extra.activo{
    background: var(--color-durazno);
    border-color: var(--color-acento-fuerte);
  }
  .fila-extra .info-extra{ display:flex; align-items:center; gap:12px; min-width:0; }
  .icono-extra{
    width: 38px; height:38px; border-radius: 50%;
    background: var(--color-blanco);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .icono-extra i{ width:18px; height:18px; color: var(--color-acento-fuerte); }
  .nombre-extra{ font-weight: 700; font-size: .9rem; }
  .extra-derecha{ display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .precio-extra{ font-size: .85rem; color: var(--color-acento-oscuro); font-weight:800; white-space:nowrap; }

  @media (max-width: 460px){
    .fila-extra{ flex-wrap: wrap; }
    .nombre-extra{ white-space:nowrap; }
    .extra-derecha{ margin-left: 50px; }
  }

  .switch{
    width: 46px; height: 26px;
    border-radius: 20px;
    background: #DED2C3;
    position: relative;
    flex-shrink: 0;
    transition: background .2s ease;
  }
  .switch .bolita{
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--color-blanco);
    position:absolute; top:3px; left:3px;
    box-shadow: 0 2px 4px rgba(0,0,0,.15);
    transition: left .2s ease;
  }
  .switch.on{ background: var(--color-acento-fuerte); }
  .switch.on .bolita{ left: 23px; }

  /* ---------- Campo de texto (decorado / notas) ---------- */
  textarea, input[type="text"], input[type="date"], input[type="time"]{
    width: 100%;
    border: 2px solid var(--color-borde-suave);
    background: var(--color-fondo);
    border-radius: var(--radio-mediano);
    padding: 12px 14px;
    font-size: .92rem;
    color: var(--color-texto);
    resize: none;
    transition: border-color .15s ease;
  }
  textarea:focus, input:focus{ border-color: var(--color-acento-fuerte); }
  label.etiqueta{
    display:flex; align-items:center; gap:7px;
    font-weight: 700;
    font-size: .85rem;
    margin: 16px 0 6px;
  }
  label.etiqueta i{ width:15px; height:15px; color: var(--color-acento-fuerte); }
  label.etiqueta:first-child{ margin-top: 0; }

  /* ---------- Stepper de cantidad +/- ---------- */
  .fila-cantidad{ display:flex; align-items:center; justify-content:space-between; }
  .stepper{ display:flex; align-items:center; gap: 10px; }
  .stepper button{
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--color-acento-fuerte);
    color: #fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--sombra-boton);
    transition: transform .12s ease, opacity .12s ease;
  }
  .stepper button i{ width:15px; height:15px; }
  .stepper button:active{ transform: scale(0.88); }
  .stepper button:disabled{ opacity: .35; box-shadow:none; }
  .stepper .cantidad{ min-width: 26px; text-align:center; font-weight: 800; font-size: 1.05rem; }

  /* ---------- Lista de "otros productos" (pays, brazos, etc.) ---------- */
  .lista-productos{ display:flex; flex-direction:column; gap:14px; margin-bottom: 18px; }
  .tarjeta-producto{
    display:flex; align-items:center; gap: 14px;
    background: var(--color-blanco);
    border-radius: var(--radio-grande);
    box-shadow: var(--sombra-suave);
    padding: 12px;
    border: 2px solid transparent;
    transition: border-color .15s ease;
  }
  .tarjeta-producto.activo{ border-color: var(--color-acento-fuerte); }
  .tarjeta-producto .foto-respaldo{
    width: 64px; height: 64px;
    border-radius: 16px;
    flex-shrink: 0;
  }
  .tarjeta-producto .foto-respaldo i{ max-width:26px; max-height:26px; }
  .info-producto{ flex: 1; min-width:0; }
  .tarjeta-producto h4{ margin:0 0 3px; font-size: .95rem; }
  .tarjeta-producto .precio-unit{ font-size: .82rem; color: var(--color-acento-oscuro); font-weight:800; }

  /* ---------- Botones grandes ---------- */
  .btn-grande{
    width: 100%;
    padding: 16px 20px;
    border-radius: var(--radio-mediano);
    background: linear-gradient(135deg, var(--color-acento) 0%, var(--color-acento-fuerte) 100%);
    color: #4a2a12;
    font-weight: 800;
    font-size: 1rem;
    box-shadow: var(--sombra-boton);
    transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  @media (hover:hover){ .btn-grande:not(:disabled):hover{ transform: translateY(-2px); box-shadow: 0 14px 26px rgba(232,121,58,0.42); } }
  .btn-grande:active{ transform: scale(0.97); }
  .btn-grande:disabled{ opacity:.45; box-shadow:none; }
  .btn-grande i{ width:18px; height:18px; }
  .btn-total{ justify-content: space-between; }
  .btn-total-label{ display:flex; align-items:center; gap:9px; }
  .btn-total-monto{
    background: rgba(255,255,255,.4);
    padding: 5px 14px;
    border-radius: 12px;
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
  }
  .btn-secundario{
    width: 100%;
    padding: 14px;
    border-radius: var(--radio-mediano);
    background: var(--color-blanco);
    color: var(--color-texto);
    font-weight: 700;
    font-size: .92rem;
    box-shadow: var(--sombra-suave);
    margin-top: 10px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-secundario i{ width:16px; height:16px; }
  .btn-whatsapp{ background: var(--color-exito); color: var(--color-exito-texto); }

  /* ---------- Barra inferior fija (misma anchura que el contenido) ---------- */
  .barra-inferior{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display:flex; justify-content:center;
    background: var(--color-blanco);
    box-shadow: 0 -8px 24px rgba(46,42,38,0.1);
    z-index: 50;
  }
  .barra-inferior-inner{
    width: 100%;
    max-width: var(--ancho-contenido);
    padding: 14px 20px;
    display:flex; align-items:center; justify-content:space-between;
    gap: 14px;
  }
  .info-total{ line-height:1.1; }
  .info-total span{ font-size:.72rem; color: var(--color-texto-suave); font-weight:800; letter-spacing:.3px; }
  .info-total strong{ font-size: 1.3rem; font-family:'Poppins',sans-serif; display:block; transition: color .2s ease; }
  .info-total strong.pulso{ animation: pulso .4s ease; }
  @keyframes pulso{
    0%{ transform: scale(1); }
    40%{ transform: scale(1.16); color: var(--color-acento-fuerte); }
    100%{ transform: scale(1); }
  }
  #btn-ver-carrito{
    background: linear-gradient(135deg, var(--color-acento) 0%, var(--color-acento-fuerte) 100%);
    color: #4a2a12;
    padding: 13px 22px;
    border-radius: 16px;
    font-weight: 800;
    box-shadow: var(--sombra-boton);
    white-space: nowrap;
    display:flex; align-items:center; gap:8px;
    transition: transform .15s ease;
  }
  #btn-ver-carrito i{ width:17px; height:17px; }

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
/* ============================================================

    extras: [

      { id: "manjar",        nombre: "Relleno de manjar",   precio: 8,  emoji: "🥛" },

  // ---------------- OTROS PRODUCTOS (con cantidad +/-) ----------------
  // "categoria" conecta cada producto con el id de CONFIG.categorias
  otrosProductos: [
    { id: "payGrande",         categoria: "pays",       nombre: "Pay grande",            precio: 70,  emoji: "🥧" },
    { id: "payPequeno",        categoria: "pays",       nombre: "Pay pequeño",           precio: 35,  emoji: "🥧" },
    { id: "payMousseGrande",   categoria: "pays",       nombre: "Pay de mousse grande",  precio: 75,  emoji: "🍮" },
    { id: "payMoussePequeno",  categoria: "pays",       nombre: "Pay de mousse pequeño", precio: 41,  emoji: "🍮" },

    { id: "brazoGrande",       categoria: "brazos",     nombre: "Brazo grande",          precio: 81,  emoji: "🍥" },
    { id: "brazoPequeno",      categoria: "brazos",     nombre: "Brazo pequeño",         precio: 44,  emoji: "🍥" },

    { id: "masitas",           categoria: "masitas",    nombre: "Masitas",               precio: 2.9, emoji: "🍪", unidad: "c/u" },
    { id: "masitasEspeciales", categoria: "masitas",    nombre: "Masitas especiales",    precio: 3.5, emoji: "🍪", unidad: "c/u" },

    { id: "brownie",           categoria: "brownies",   nombre: "Brownie",                precio: 5.8, emoji: "🍫" },

    { id: "vaso20",            categoria: "vasos",      nombre: "Vaso 20 oz",             precio: 70,  emoji: "🥤" },
    { id: "vaso25",            categoria: "vasos",      nombre: "Vaso 25 oz",             precio: 87,  emoji: "🥤" },

    { id: "miniTortaNormal",   categoria: "minitortas", nombre: "Mini torta normal",      precio: 17,  emoji: "🧁" },
    { id: "miniTortaEspecial", categoria: "minitortas", nombre: "Mini torta especial",    precio: 19,  emoji: "🧁" },
  ],
};

/* ============================================================
   ICONOS DE INTERFAZ (reemplazan a los emojis de CONFIG en la UI)
   CONFIG no se modifica: estos mapas solo indican qué ícono de
   línea (Lucide) usar para cada id, y qué foto buscar en img/.
   ============================================================ */
const ICONOS_CATEGORIA = {
  tortas: "cake-slice", pays: "pie-chart", brazos: "disc",
  masitas: "cookie", brownies: "square", vasos: "cup-soda", minitortas: "cake-slice",
};
const ICONOS_TIPO_TORTA = { Normal: "circle", Semi: "layers", Especial: "sparkles" };
const ICONOS_EXTRA = { masaChocolate: "cookie", manjar: "milk", personalizado: "palette" };

/* ============================================================
   FOTOS DISPONIBLES (demo)
   Solo hay 4 fotos reales por ahora. FOTOS_CATEGORIA y
   FOTOS_TIPO_TORTA asignan la foto que corresponde a cada
   categoría/tipo; fotoDemo() rellena todo lo demás (sabores,
   otros productos, categorías sin foto propia) reciclando estas
   mismas fotos para que ninguna tarjeta quede vacía.
   ============================================================ */
const FOTOS_DEMO = ["img/especial.jpg", "img/semi.jpg", "img/pay.jpg"];
function fotoDemo(indice){ return FOTOS_DEMO[indice % FOTOS_DEMO.length]; }

const FOTOS_CATEGORIA = {
  tortas: "img/especial.jpg",
  pays: "img/pay.jpg",
  brazos: "img/semi.jpg",
  masitas: "img/pay.jpg",
  brownies: "img/especial.jpg",
  vasos: "img/semi.jpg",
  minitortas: "img/pay.jpg",
};
const FOTOS_TIPO_TORTA = { Normal: "img/pay.jpg", Semi: "img/semi.jpg", Especial: "img/especial.jpg" };

/* ============================================================
   ESTADO DE LA APLICACIÓN
   ============================================================ */
const estado = {
  pantalla: "inicio",       // inicio | torta | categoria | carrito | checkout
  categoriaActual: null,    // id de categoría cuando pantalla === "categoria"
  carrito: [],              // lista de productos agregados
  indiceEdicionCarrito: null, // índice del item del carrito que se está editando (tortas)

  // Cantidades temporales en pantalla de "otros productos" (se reinician al salir)
  cantidadesTemp: {},

  // Torta que se está armando actualmente
  tortaTemp: {
    tamano: null,
    tipo: null,
    sabor: null,
    extras: {},       // { masaChocolate: true/false, ... }
    decorado: "",
    cantidad: 1,
  },

  // Datos del formulario de checkout (se mantienen al navegar)
  checkout: {
    nombre: "",
    fecha: "",
    hora: "",
    entrega: "recojo", // "recojo" | "envio"
    direccion: "",
    notas: "",
  },
};

/* ============================================================
   UTILIDADES
   ============================================================ */

// Formatea un número como moneda en bolivianos, ej: 151 -> "Bs 151.00"
function formatearBs(numero){
  return "Bs " + numero.toFixed(2);
}

// Genera un id único simple para cada línea del carrito
function generarIdCarrito(){
  return "item_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
}

// Genera el bloque de foto con respaldo automático: si la imagen no existe,
// se elimina sola (onerror) y queda visible el ícono de línea de fondo.
function foto(ruta, alt, icono){
  return `<i data-lucide="${icono}"></i><img src="${ruta}" alt="${alt}" loading="lazy" onerror="this.remove()">`;
}

// Insignia de "check" para la esquina de una opción seleccionada
function insigniaSeleccion(){
  return `<span class="check-badge"><i data-lucide="check"></i></span>`;
}

// Precio más bajo disponible dentro de una categoría (para el "desde Bs X" del inicio)
function precioDesdeCategoria(idCategoria){
  if(idCategoria === "tortas"){
    let minimo = Infinity;
    Object.values(CONFIG.tortas.precios).forEach(porTipo => {
      Object.values(porTipo).forEach(precio => { if(precio < minimo) minimo = precio; });
    });
    return minimo;
  }
  const productos = CONFIG.otrosProductos.filter(p => p.categoria === idCategoria);
  return productos.length ? Math.min(...productos.map(p => p.precio)) : 0;
}

// Muestra un mensaje flotante breve (confirmaciones de "agregado", etc.)
let toastTimeout = null;
function mostrarToast(mensaje){
  const toast = document.getElementById("toast");
  toast.textContent = mensaje;
  toast.classList.add("mostrar");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove("mostrar"), 1800);
}

// Calcula el precio total de un objeto "torta temporal" o de un item del carrito tipo torta
function calcularPrecioTorta(torta){
  if(!torta.tamano || !torta.tipo) return 0;
  let base = CONFIG.tortas.precios[torta.tamano][torta.tipo];
  let totalExtras = 0;
  CONFIG.tortas.extras.forEach(extra => {
    if(torta.extras[extra.id]) totalExtras += extra.precio;
  });
  return (base + totalExtras) * (torta.cantidad || 1);
}

// Calcula el total general del carrito
function calcularTotalCarrito(){
  return estado.carrito.reduce((suma, item) => suma + item.precioTotal, 0);
}

// Actualiza el monto visible en la barra inferior fija (con pequeña animación al cambiar)
function actualizarBarraInferior(){
  const montoEl = document.getElementById("total-monto");
  const textoNuevo = formatearBs(calcularTotalCarrito());
  if(montoEl.textContent !== textoNuevo){
    montoEl.textContent = textoNuevo;
    montoEl.classList.remove("pulso");
    void montoEl.offsetWidth; // reinicia la animación
    montoEl.classList.add("pulso");
  }
  // En la pantalla de checkout ocultamos la barra para no estorbar el formulario
  const barra = document.getElementById("barra-inferior");
  barra.style.display = (estado.pantalla === "checkout") ? "none" : "flex";
}

// Cambia de pantalla y vuelve a renderizar
function irA(pantalla, extra){
  estado.pantalla = pantalla;
  if(pantalla === "categoria") estado.categoriaActual = extra;
  if(pantalla !== "torta") estado.indiceEdicionCarrito = null;
  window.scrollTo(0,0);
  render();
}

/* ============================================================
   RENDERIZADO PRINCIPAL
   ============================================================ */
function render(){
  const contenedor = document.getElementById("app-content");

  switch(estado.pantalla){
    case "inicio":     contenedor.innerHTML = vistaInicio(); break;
    case "torta":      contenedor.innerHTML = vistaTorta(); break;
    case "categoria":  contenedor.innerHTML = vistaCategoria(); break;
    case "carrito":    contenedor.innerHTML = vistaCarrito(); break;
    case "checkout":   contenedor.innerHTML = vistaCheckout(); break;
    default:           contenedor.innerHTML = vistaInicio();
  }

  actualizarBarraInferior();
  if(window.lucide) window.lucide.createIcons();
}

/* ============================================================
   VISTA: INICIO (hero + categorías en tarjetas con foto)
   ============================================================ */
function vistaInicio(){
  const tarjetas = CONFIG.categorias.map((cat, i) => `
    <button class="tarjeta-categoria" onclick="seleccionarCategoria('${cat.id}')">
      <div class="foto-respaldo">${foto(FOTOS_CATEGORIA[cat.id] || fotoDemo(i), cat.nombre, ICONOS_CATEGORIA[cat.id] || "image")}</div>
      <div class="info-categoria">
        <span class="nombre-categoria">${cat.nombre}</span>
        <span class="desde-categoria">desde ${formatearBs(precioDesdeCategoria(cat.id))}</span>
      </div>
    </button>
  `).join("");

  return `
    <section class="hero">
      <div class="hero-contenido">
        <img class="hero-logo" src="img/logo.png" alt="Gema Pastelería" loading="lazy">
        <h2>Gema Pastelería</h2>
        <p>Te acompañamos en toda ocasión</p>
      </div>
    </section>

    <div class="intro-categorias">
      <h3>¿Qué se te antoja hoy?</h3>
      <p>Elige una categoría para comenzar tu pedido</p>
    </div>
    <div class="grid-categorias">${tarjetas}</div>
  `;
}

// Decide a qué pantalla ir según la categoría elegida
function seleccionarCategoria(id){
  if(id === "tortas"){
    // Reinicia el formulario de torta antes de abrir el armador
    estado.tortaTemp = { tamano:null, tipo:null, sabor:null, extras:{}, decorado:"", cantidad:1 };
    estado.indiceEdicionCarrito = null;
    irA("torta");
  } else {
    estado.cantidadesTemp = {}; // reinicia contadores de esa categoría
    irA("categoria", id);
  }
}

/* ============================================================
   VISTA: ARMADOR DE TORTAS
   ============================================================ */

// Calcula el estado de la barra de progreso según lo que ya eligió el cliente
function pasosProgreso(t){
  const tipoListo = !!(t.tamano && t.tipo && (t.tipo !== "Especial" || t.sabor));
  const pasos = [
    { nombre: "Tamaño",    hecho: !!t.tamano },
    { nombre: "Tipo",      hecho: tipoListo },
    { nombre: "Extras",    hecho: tipoListo },
    { nombre: "Decorado",  hecho: tipoListo },
    { nombre: "Confirmar", hecho: tipoListo },
  ];
  let actualIdx = pasos.findIndex(p => !p.hecho);
  if(actualIdx === -1) actualIdx = pasos.length - 1;

  return `<div class="progreso-pasos">${pasos.map((p, i) => `
    <div class="paso ${p.hecho ? "hecho" : ""} ${i === actualIdx ? "actual" : ""}">
      <span class="paso-circulo">${p.hecho ? '<i data-lucide="check"></i>' : (i + 1)}</span>
      <span class="paso-nombre">${p.nombre}</span>
    </div>
    ${i < pasos.length - 1 ? '<span class="paso-linea"></span>' : ""}
  `).join("")}</div>`;
}

function vistaTorta(){
  const t = estado.tortaTemp;
  const editando = estado.indiceEdicionCarrito !== null;

  // --- Chips de tamaño (muestran el precio según el tipo ya elegido) ---
  const chipsTamano = CONFIG.tortas.tamanios.map(tam => {
    const activo = t.tamano === tam;
    const precio = t.tipo ? CONFIG.tortas.precios[tam][t.tipo] : null;
    return `
      <button class="chip opcion-seleccionable ${activo ? "seleccionado" : ""}" onclick="elegirTamanoTorta('${tam}')">
        ${activo ? insigniaSeleccion() : ""}
        <span class="chip-tam">${tam} porc.</span>
        ${precio !== null ? `<span class="chip-precio">${formatearBs(precio)}</span>` : ""}
      </button>
    `;
  }).join("");

  // --- Tarjetas de tipo (con foto y descripción corta) ---
  const chipsTipo = CONFIG.tortas.tipos.map((tipo, i) => {
    const activo = t.tipo === tipo.id;
    return `
      <button class="tarjeta-tipo opcion-seleccionable ${activo ? "seleccionado" : ""}" onclick="elegirTipoTorta('${tipo.id}')">
        ${activo ? insigniaSeleccion() : ""}
        <div class="foto-respaldo">${foto(FOTOS_TIPO_TORTA[tipo.id] || fotoDemo(i), tipo.nombre, ICONOS_TIPO_TORTA[tipo.id] || "cake-slice")}</div>
        <div class="info-tipo">
          <span class="nombre-tipo">${tipo.nombre}</span>
          <span class="desc-tipo">${tipo.descripcion}</span>
        </div>
      </button>
    `;
  }).join("");

  // --- Tarjetas de sabor (solo si el tipo es Especial), con foto pequeña ---
  const mostrarSabores = t.tipo === "Especial";
  const chipsSabor = CONFIG.tortas.saboresEspecial.map((sabor, i) => {
    const activo = t.sabor === sabor;
    return `
      <button class="tarjeta-sabor opcion-seleccionable ${activo ? "seleccionado" : ""}" onclick="elegirSaborTorta('${sabor}')">
        ${activo ? insigniaSeleccion() : ""}
        <div class="foto-respaldo">${foto(fotoDemo(i), sabor, "sparkles")}</div>
        <span class="nombre-sabor">${sabor}</span>
      </button>
    `;
  }).join("");

  // --- Caja de precio base (solo si ya hay tamaño y tipo) ---
  const hayPrecioBase = !!(t.tamano && t.tipo);
  const precioBase = hayPrecioBase ? CONFIG.tortas.precios[t.tamano][t.tipo] : 0;

  // --- Extras ---
  const filasExtras = CONFIG.tortas.extras.map(extra => {
    const activo = !!t.extras[extra.id];
    return `
      <div class="fila-extra ${activo ? "activo" : ""}" onclick="alternarExtraTorta('${extra.id}')">
        <div class="info-extra">
          <span class="icono-extra"><i data-lucide="${ICONOS_EXTRA[extra.id] || "plus"}"></i></span>
          <span class="nombre-extra">${extra.nombre}</span>
        </div>
        <div class="extra-derecha">
          <span class="precio-extra">+ ${formatearBs(extra.precio)}</span>
          <div class="switch ${activo ? "on" : ""}"><div class="bolita"></div></div>
        </div>
      </div>
    `;
  }).join("");

  // --- Validación para habilitar el botón de agregar ---
  const puedeAgregar = !!(t.tamano && t.tipo && (t.tipo !== "Especial" || t.sabor));
  const precioFinal = calcularPrecioTorta(t);

  return `
    <div class="fila-volver">
      <button class="btn-volver" onclick="irA('inicio')"><i data-lucide="arrow-left"></i></button>
      <h2 class="titulo-pantalla">${editando ? "Editar torta" : "Arma tu torta"}</h2>
    </div>

    ${pasosProgreso(t)}

    <div class="seccion">
      <h3><span class="paso-num">1</span> Elige el tamaño</h3>
      <div class="grid-chips">${chipsTamano}</div>
    </div>

    <div class="seccion">
      <h3><span class="paso-num">2</span> Elige el tipo</h3>
      <div class="grid-tipos">${chipsTipo}</div>
    </div>

    ${mostrarSabores ? `
    <div class="seccion">
      <h3><span class="paso-num">3</span> Elige el sabor</h3>
      <div class="grid-sabores">${chipsSabor}</div>
    </div>` : ""}

    ${hayPrecioBase ? `
    <div class="caja-precio">
      <span>Precio base</span>
      <strong>${formatearBs(precioBase)}</strong>
    </div>` : ""}

    <div class="seccion">
      <h3><i data-lucide="sparkles"></i> Extras opcionales</h3>
      ${filasExtras}
    </div>

    <div class="seccion">
      <h3><i data-lucide="palette"></i> ¿Cómo quieres el decorado?</h3>
      <textarea rows="2" placeholder="Describe el decorado: colores, temática, texto en la torta..." oninput="actualizarDecorado(this.value)">${t.decorado}</textarea>
    </div>

    <div class="seccion fila-cantidad">
      <h3 style="margin:0;">Cantidad</h3>
      <div class="stepper">
        <button onclick="cambiarCantidadTorta(-1)" ${t.cantidad <= 1 ? "disabled" : ""}><i data-lucide="minus"></i></button>
        <span class="cantidad">${t.cantidad}</span>
        <button onclick="cambiarCantidadTorta(1)"><i data-lucide="plus"></i></button>
      </div>
    </div>

    <button class="btn-grande btn-total" ${puedeAgregar ? "" : "disabled"} onclick="agregarTortaAlCarrito()">
      <span class="btn-total-label"><i data-lucide="${editando ? "save" : "shopping-cart"}"></i>${editando ? "Guardar cambios" : "Agregar al carrito"}</span>
      <span class="btn-total-monto">${formatearBs(precioFinal)}</span>
    </button>
    ${!puedeAgregar ? `<p class="ayuda-texto">Elige tamaño, tipo${mostrarSabores ? " y sabor" : ""} para continuar</p>` : ""}
  `;
}

// ---- Acciones del armador de tortas ----
function elegirTamanoTorta(tam){ estado.tortaTemp.tamano = tam; render(); }
function elegirTipoTorta(tipo){
  estado.tortaTemp.tipo = tipo;
  if(tipo !== "Especial") estado.tortaTemp.sabor = null; // el sabor solo aplica a Especial
  render();
}
function elegirSaborTorta(sabor){ estado.tortaTemp.sabor = sabor; render(); }
function alternarExtraTorta(idExtra){
  estado.tortaTemp.extras[idExtra] = !estado.tortaTemp.extras[idExtra];
  render();
}
function actualizarDecorado(valor){ estado.tortaTemp.decorado = valor; }
function cambiarCantidadTorta(delta){
  estado.tortaTemp.cantidad = Math.max(1, estado.tortaTemp.cantidad + delta);
  render();
}

// Arma la descripción legible de una torta (para carrito y mensaje de WhatsApp)
function describirTorta(t){
  const tipoInfo = CONFIG.tortas.tipos.find(x => x.id === t.tipo);
  let desc = `Torta ${tipoInfo.nombre} · ${t.tamano} porciones`;
  if(t.tipo === "Especial" && t.sabor) desc += ` · Sabor: ${t.sabor}`;
  if(t.tipo !== "Especial") desc += ` · ${tipoInfo.descripcion}`;

  const extrasElegidos = CONFIG.tortas.extras.filter(ex => t.extras[ex.id]).map(ex => ex.nombre);
  if(extrasElegidos.length) desc += `\nExtras: ${extrasElegidos.join(", ")}`;
  if(t.decorado && t.decorado.trim()) desc += `\nDecorado: "${t.decorado.trim()}"`;

  return desc;
}

// Agrega (o guarda edición de) la torta armada al carrito
function agregarTortaAlCarrito(){
  const t = estado.tortaTemp;
  const precioUnitario = calcularPrecioTorta({...t, cantidad:1});

  const itemCarrito = {
    idCarrito: estado.indiceEdicionCarrito !== null
      ? estado.carrito[estado.indiceEdicionCarrito].idCarrito
      : generarIdCarrito(),
    tipoItem: "torta",
    nombre: "Torta " + CONFIG.tortas.tipos.find(x => x.id === t.tipo).nombre,
    icono: "cake-slice",
    detalle: describirTorta(t),
    cantidad: t.cantidad,
    precioUnitario: precioUnitario,
    precioTotal: precioUnitario * t.cantidad,
    datosTorta: JSON.parse(JSON.stringify(t)), // copia para poder reeditar luego
  };

  if(estado.indiceEdicionCarrito !== null){
    estado.carrito[estado.indiceEdicionCarrito] = itemCarrito;
    mostrarToast("Torta actualizada en el carrito");
  } else {
    estado.carrito.push(itemCarrito);
    mostrarToast("Torta agregada al carrito");
  }

  irA("carrito");
}

/* ============================================================
   VISTA: CATEGORÍA DE PRODUCTOS SIMPLES (pays, brazos, masitas...)
   ============================================================ */
function vistaCategoria(){
  const cat = CONFIG.categorias.find(c => c.id === estado.categoriaActual);
  const productos = CONFIG.otrosProductos.filter(p => p.categoria === estado.categoriaActual);

  const filasProductos = productos.map((prod, i) => {
    const cantidad = estado.cantidadesTemp[prod.id] || 0;
    return `
      <div class="tarjeta-producto ${cantidad > 0 ? "activo" : ""}">
        <div class="foto-respaldo">${foto(fotoDemo(i), prod.nombre, ICONOS_CATEGORIA[cat.id] || "image")}</div>
        <div class="info-producto">
          <h4>${prod.nombre}</h4>
          <div class="precio-unit">${formatearBs(prod.precio)} ${prod.unidad ? prod.unidad : "c/u"}</div>
        </div>
        <div class="stepper">
          <button onclick="cambiarCantidadTemp('${prod.id}', -1)" ${cantidad <= 0 ? "disabled" : ""}><i data-lucide="minus"></i></button>
          <span class="cantidad">${cantidad}</span>
          <button onclick="cambiarCantidadTemp('${prod.id}', 1)"><i data-lucide="plus"></i></button>
        </div>
      </div>
    `;
  }).join("");

  // Total parcial de lo que el cliente está por agregar en esta pantalla
  const totalParcial = productos.reduce((suma, prod) => {
    const cantidad = estado.cantidadesTemp[prod.id] || 0;
    return suma + (cantidad * prod.precio);
  }, 0);

  const hayAlgoSeleccionado = productos.some(p => (estado.cantidadesTemp[p.id] || 0) > 0);

  return `
    <div class="fila-volver">
      <button class="btn-volver" onclick="irA('inicio')"><i data-lucide="arrow-left"></i></button>
      <h2 class="titulo-pantalla">${cat.nombre}</h2>
    </div>

    <div class="lista-productos">${filasProductos}</div>

    <button class="btn-grande btn-total" ${hayAlgoSeleccionado ? "" : "disabled"} onclick="agregarProductosDeCategoria()">
      <span class="btn-total-label"><i data-lucide="shopping-cart"></i>Agregar al carrito</span>
      <span class="btn-total-monto">${formatearBs(totalParcial)}</span>
    </button>
  `;
}

function cambiarCantidadTemp(idProducto, delta){
  const actual = estado.cantidadesTemp[idProducto] || 0;
  estado.cantidadesTemp[idProducto] = Math.max(0, actual + delta);
  render();
}

// Agrega todos los productos con cantidad > 0 de la categoría actual como líneas separadas del carrito
function agregarProductosDeCategoria(){
  const productos = CONFIG.otrosProductos.filter(p => p.categoria === estado.categoriaActual);
  let algoAgregado = false;

  productos.forEach(prod => {
    const cantidad = estado.cantidadesTemp[prod.id] || 0;
    if(cantidad > 0){
      estado.carrito.push({
        idCarrito: generarIdCarrito(),
        tipoItem: "simple",
        idProducto: prod.id,
        nombre: prod.nombre,
        icono: ICONOS_CATEGORIA[prod.categoria] || "image",
        detalle: `${formatearBs(prod.precio)} ${prod.unidad ? prod.unidad : "c/u"}`,
        cantidad: cantidad,
        precioUnitario: prod.precio,
        precioTotal: prod.precio * cantidad,
      });
      algoAgregado = true;
    }
  });

  if(algoAgregado){
    estado.cantidadesTemp = {};
    mostrarToast("Agregado al carrito");
    irA("carrito");
  }
}

/* ============================================================
   VISTA: CARRITO
   ============================================================ */
function vistaCarrito(){
  if(estado.carrito.length === 0){
    return `
      <div class="fila-volver">
        <button class="btn-volver" onclick="irA('inicio')"><i data-lucide="arrow-left"></i></button>
        <h2 class="titulo-pantalla">Tu carrito</h2>
      </div>
      <div class="carrito-vacio">
        <i data-lucide="shopping-bag"></i>
        <p>Tu carrito está vacío todavía.<br>¡Elige algo rico para empezar!</p>
      </div>
      <button class="btn-grande" onclick="irA('inicio')"><i data-lucide="arrow-left"></i>Ver categorías</button>
    `;
  }

  const filas = estado.carrito.map((item, index) => `
    <div class="item-carrito">
      <div class="fila-top">
        <div>
          <h4>${item.nombre} ${item.tipoItem === 'simple' ? `× ${item.cantidad}` : ""}</h4>
          <div class="detalle-item">${item.detalle.replace(/\n/g, "<br>")}</div>
          ${item.tipoItem === "torta" ? `<div class="detalle-item">Cantidad: ${item.cantidad}</div>` : ""}
        </div>
        <div class="precio-item">${formatearBs(item.precioTotal)}</div>
      </div>
      <div class="fila-acciones">
        <div class="stepper">
          <button onclick="cambiarCantidadCarrito(${index}, -1)"><i data-lucide="minus"></i></button>
          <span class="cantidad">${item.cantidad}</span>
          <button onclick="cambiarCantidadCarrito(${index}, 1)"><i data-lucide="plus"></i></button>
        </div>
        <div class="botones-mini">
          ${item.tipoItem === "torta" ? `<button class="btn-mini" onclick="editarTortaDelCarrito(${index})"><i data-lucide="pencil"></i>Editar</button>` : ""}
          <button class="btn-mini eliminar" onclick="eliminarDelCarrito(${index})"><i data-lucide="trash-2"></i>Eliminar</button>
        </div>
      </div>
    </div>
  `).join("");

  return `
    <div class="fila-volver">
      <button class="btn-volver" onclick="irA('inicio')"><i data-lucide="arrow-left"></i></button>
      <h2 class="titulo-pantalla">Tu carrito</h2>
    </div>

    ${filas}

    <div class="resumen-total">
      <span>Total del pedido</span>
      <strong>${formatearBs(calcularTotalCarrito())}</strong>
    </div>

    <button class="btn-grande" onclick="irA('checkout')"><i data-lucide="check"></i>Finalizar pedido</button>
    <button class="btn-secundario" onclick="irA('inicio')"><i data-lucide="plus"></i>Seguir comprando</button>
  `;
}

// Cambia cantidad directamente desde el carrito (recalcula el total de la línea)
function cambiarCantidadCarrito(index, delta){
  const item = estado.carrito[index];
  const nuevaCantidad = item.cantidad + delta;
  if(nuevaCantidad <= 0){
    eliminarDelCarrito(index);
    return;
  }
  item.cantidad = nuevaCantidad;
  item.precioTotal = item.precioUnitario * item.cantidad;
  render();
}

function eliminarDelCarrito(index){
  estado.carrito.splice(index, 1);
  mostrarToast("Producto eliminado");
  render();
}

// Reabre el armador de tortas cargado con los datos de esa línea del carrito
function editarTortaDelCarrito(index){
  const item = estado.carrito[index];
  estado.tortaTemp = JSON.parse(JSON.stringify(item.datosTorta));
  estado.indiceEdicionCarrito = index;
  irA("torta");
}

/* ============================================================
   VISTA: CHECKOUT (datos finales + envío por WhatsApp)
   ============================================================ */
function vistaCheckout(){
  const c = estado.checkout;

  return `
    <div class="fila-volver">
      <button class="btn-volver" onclick="irA('carrito')"><i data-lucide="arrow-left"></i></button>
      <h2 class="titulo-pantalla">Finalizar pedido</h2>
    </div>

    <div class="seccion">
      <label class="etiqueta"><i data-lucide="user"></i>Nombre completo</label>
      <input type="text" placeholder="Ej: María Pérez" value="${c.nombre}" oninput="actualizarCheckout('nombre', this.value)">

      <label class="etiqueta"><i data-lucide="calendar"></i>Fecha de entrega</label>
      <input type="date" value="${c.fecha}" oninput="actualizarCheckout('fecha', this.value)">

      <label class="etiqueta"><i data-lucide="clock"></i>Hora de entrega</label>
      <input type="time" value="${c.hora}" oninput="actualizarCheckout('hora', this.value)">

      <label class="etiqueta"><i data-lucide="truck"></i>Tipo de entrega</label>
      <div class="opciones-entrega">
        <button class="opcion-entrega opcion-seleccionable ${c.entrega === 'recojo' ? 'seleccionado' : ''}" onclick="elegirTipoEntrega('recojo')">
          <i data-lucide="home"></i>Recojo en tienda
        </button>
        <button class="opcion-entrega opcion-seleccionable ${c.entrega === 'envio' ? 'seleccionado' : ''}" onclick="elegirTipoEntrega('envio')">
          <i data-lucide="truck"></i>Envío a domicilio
        </button>
      </div>

      ${c.entrega === 'envio' ? `
      <label class="etiqueta"><i data-lucide="map-pin"></i>Dirección de envío</label>
      <input type="text" placeholder="Zona, calle, número, referencia" value="${c.direccion}" oninput="actualizarCheckout('direccion', this.value)">
      ` : ""}

      <label class="etiqueta"><i data-lucide="sticky-note"></i>Notas adicionales (opcional)</label>
      <textarea rows="3" placeholder="Ej: sin azúcar, entregar en portería, etc." oninput="actualizarCheckout('notas', this.value)">${c.notas}</textarea>
    </div>

    <div class="resumen-total">
      <span>Total a pagar</span>
      <strong>${formatearBs(calcularTotalCarrito())}</strong>
    </div>

    <button class="btn-grande btn-whatsapp" onclick="enviarPedidoPorWhatsapp()">
      <i data-lucide="send"></i>Enviar pedido por WhatsApp
    </button>
  `;
}

function actualizarCheckout(campo, valor){
  estado.checkout[campo] = valor;
}
function elegirTipoEntrega(tipo){
  estado.checkout.entrega = tipo;
  render();
}

// Construye el mensaje final y abre WhatsApp con el pedido prellenado
function enviarPedidoPorWhatsapp(){
  const c = estado.checkout;

  if(!c.nombre.trim()){
    mostrarToast("Escribe tu nombre antes de enviar");
    return;
  }
  if(estado.carrito.length === 0){
    mostrarToast("Tu carrito está vacío");
    return;
  }

  // --- Encabezado del mensaje ---
  let mensaje = `*NUEVO PEDIDO - ${CONFIG.nombreTienda.toUpperCase()}*\n\n`;
  mensaje += `*Cliente:* ${c.nombre.trim()}\n`;
  mensaje += `*Fecha de entrega:* ${c.fecha || "(no especificada)"}\n`;
  mensaje += `*Hora de entrega:* ${c.hora || "(no especificada)"}\n`;
  mensaje += `*Entrega:* ${c.entrega === 'recojo' ? 'Recojo en tienda' : 'Envío a domicilio'}\n`;
  if(c.entrega === 'envio') mensaje += `*Dirección:* ${c.direccion.trim() || "(no especificada)"}\n`;
  if(c.notas.trim()) mensaje += `*Notas:* ${c.notas.trim()}\n`;

  // --- Detalle de productos ---
  mensaje += `\n*DETALLE DEL PEDIDO:*\n`;
  estado.carrito.forEach((item, i) => {
    mensaje += `\n${i + 1}. *${item.nombre}*`;
    if(item.tipoItem === "torta"){
      mensaje += `\n${item.detalle}`;
      mensaje += `\nCantidad: ${item.cantidad} × ${formatearBs(item.precioUnitario)} = ${formatearBs(item.precioTotal)}\n`;
    } else {
      mensaje += `\nCantidad: ${item.cantidad} × ${formatearBs(item.precioUnitario)} = ${formatearBs(item.precioTotal)}\n`;
    }
  });

  // --- Total final ---
  mensaje += `\n*TOTAL: ${formatearBs(calcularTotalCarrito())}*\n`;
  mensaje += `\n¡Gracias por tu pedido!`;

  const url = `https://wa.me/${CONFIG.numeroWhatsapp}?text=${encodeURIComponent(mensaje)}`;
  window.open(url, "_blank");
}

/* ============================================================
   INICIO DE LA APLICACIÓN
   ============================================================ */
render();
</script>
</body>
</html>
